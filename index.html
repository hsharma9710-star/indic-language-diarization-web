<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indic language diarization</title>
<meta name="description" content="Upload speech that mixes English and Indian languages and get an RTTM file, a language-coloured waveform and pooled audio per language, optionally scored against a reference RTTM (DER). Two models to choose from. Runs entirely in your browser; nothing is uploaded.">
<style>
  :root { --bg:#ffffff; --fg:#111827; --muted:#6b7280; --card:#f3f4f6; --line:#d1d5db; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f172a; --fg:#e5e7eb; --muted:#94a3b8; --card:#1e293b; --line:#334155; --accent:#60a5fa; } }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  main { max-width:880px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:1.6rem; margin:0 0 4px; }
  p.lead { color:var(--muted); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin:16px 0; }
  label { display:block; font-weight:600; margin:0 0 4px; font-size:.9rem; }
  select, input[type=number], input[type=file] { width:100%; padding:8px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--fg); font:inherit; }
  .row { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 18px; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .tabs { display:flex; gap:8px; margin:0 0 16px; flex-wrap:wrap; }
  .tabs button { background:var(--card); color:var(--fg); border:1px solid var(--line); }
  .tabs button[aria-selected=true] { background:var(--accent); color:#fff; border-color:var(--accent); }
  progress { width:100%; height:14px; }
  #status { color:var(--muted); min-height:1.4em; }
  #err { color:#dc2626; font-weight:600; }
  canvas { width:100%; height:auto; border-radius:8px; background:#fff; border:1px solid var(--line); }
  pre { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px; overflow:auto; max-height:240px; font-size:.82rem; }
  audio { width:100%; }
  .legend span { display:inline-block; margin-right:14px; }
  .dot { display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
  small { color:var(--muted); }
  a { color:var(--accent); }
  th, td { padding:4px 8px; border-bottom:1px solid var(--line); text-align:left; }
</style>
</head>
<body>
<main>
  <h1>Language diarization: English + Indian languages</h1>
  <div class="tabs" role="tablist">
    <button id="tabOurs" role="tab" aria-selected="true">CLSRIL-Transformer-LD</button>
    <button id="tabWl" role="tab" aria-selected="false">Whisper-Linear-LD</button>
  </div>
  <p class="lead" id="lead"></p>

  <div class="card">
    <label for="file">Audio file</label>
    <input id="file" type="file" accept="audio/*,video/mp4">
    <div class="row" style="margin-top:12px">
      <div class="oursOnly"><label for="l1">Indian language 1</label><select id="l1"></select></div>
      <div class="oursOnly"><label for="l2">Indian language 2</label><select id="l2"></select></div>
      <div><label for="ws">Picture: start (s)</label><input id="ws" type="number" min="0" value="0"></div>
      <div><label for="wl">Picture: length (s)</label><input id="wl" type="number" min="2" placeholder="whole file (up to 60 s)"></div>
    </div>
    <p class="oursOnly"><label style="display:flex;gap:8px;align-items:center;font-weight:normal"><input id="engchk" type="checkbox" checked>
    English check (recommended): finds English that the model missed, e.g. in Hindi news.</label></p>

    <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)">
      <label for="refrttm">Reference RTTM (optional): score the result and get the DER</label>
      <input id="refrttm" type="file" accept=".rttm,.txt,text/plain">
      <select id="refid" hidden style="margin-top:8px"></select>
      <p style="margin:6px 0 0"><small id="refinfo"></small></p>
    </div>

    <p style="margin-top:14px"><button id="go">Diarize</button></p>
    <p id="status"></p>
    <progress id="bar" max="1" value="0" hidden></progress>
    <p id="err"></p>
  </div>

  <div id="results" hidden>
    <div class="card">
      <h2 style="margin-top:0">Result</h2>
      <p id="summary"></p>
      <div class="legend" id="legend"></div>
      <canvas id="plot" width="1600" height="420"></canvas>
      <p><button id="dlpng">Download picture (PNG)</button></p>
    </div>
    <div class="card" id="dercard" hidden>
      <h2 style="margin-top:0">DER</h2>
      <div id="derout"></div>
    </div>
    <div class="card">
      <h2 style="margin-top:0">RTTM</h2>
      <pre id="rttm"></pre>
      <button id="dlrttm">Download RTTM</button>
    </div>
    <div class="card">
      <h2 style="margin-top:0">Pooled audio per language</h2>
      <div id="pooled"></div>
    </div>
  </div>

  <p><small>CLSRIL-Transformer-LD: <a href="https://github.com/hsharma9710-star/indic-language-diarization">github.com/hsharma9710-star/indic-language-diarization</a><br>
  Whisper-Linear-LD: <a href="https://github.com/MohitAiry/Whisper-Linear-LD">github.com/MohitAiry/Whisper-Linear-LD</a></small></p>
</main>
<script src="coi-serviceworker.js"></script>
<script src="ort.min.js"></script>
<script src="der.js?v=2"></script>
<script src="wlld.js?v=1"></script>
<script src="app.js?v=11"></script>
</body>
</html>
